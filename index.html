<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenTable AI 影音生成</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; text-align: center; background: #f9f9f9; }
    .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    textarea { width: 100%; height: 90px; margin-bottom: 15px; padding: 10px; border-radius: 6px; border: 1px solid #ddd; }
    input[type="file"] { margin-bottom: 15px; }
    #preview { max-width: 150px; display: block; margin: 10px auto; border-radius: 6px; }
    button { background: #6366f1; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #4f46e5; }
    #status { margin-top: 15px; color: #555; font-weight: bold; }
    .result-box { margin-top: 20px; white-space: pre-wrap; text-align: left; background: #eee; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>TokenTable 影音生成工具</h2>
    <p style="color: #666; font-size: 14px;">上傳圖片並輸入你的動態提示詞</p>
    
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage()">
    <img id="preview" src="" style="display:none;">

    <textarea id="prompt" placeholder="輸入提示詞（例如：讓圖片中的人物微笑並轉頭看鏡頭...）"></textarea>
    <br>
    <button onclick="submitTask()">開始生成</button>
    
    <div id="status"></div>
    <div id="resultBox" class="result-box" style="display:none;"></div>
  </div>

  <script>
    let base64Image = "";

    function previewImage() {
      const file = document.getElementById("imageInput").files[0];
      const reader = new FileReader();
      reader.onloadend = function () {
        base64Image = reader.result;
        const img = document.getElementById("preview");
        img.src = base64Image;
        img.style.display = "block";
      }
      if (file) reader.readAsDataURL(file);
    }

    async function submitTask() {
      const prompt = document.getElementById("prompt").value;
      const status = document.getElementById("status");
      const resultBox = document.getElementById("resultBox");

      if (!prompt) return alert("請輸入提示詞！");

      status.innerText = "正在透過 TokenTable 提交任務...";
      resultBox.style.display = "none";

      try {
        const res = await fetch("/.netlify/functions/api", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, imageBase64: base64Image })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        status.innerText = "任務處理完成！";
        resultBox.innerText = data.result;
        resultBox.style.display = "block";
      } catch (err) {
        status.innerText = "發生錯誤：" + err.message;
      }
    }
  </script>
</body>
</html>
