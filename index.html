<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokenTable AI 助手</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; max-width: 600px; margin: 0 auto; }
    h2 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
    textarea { width: 100%; height: 120px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: #fff; padding: 12px; font-size: 15px; resize: none; margin-bottom: 12px; }
    button { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status { margin-top: 15px; text-align: center; font-size: 14px; color: #94a3b8; }
    .result-box { margin-top: 20px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 15px; white-space: pre-wrap; font-size: 15px; line-height: 1.6; display: none; }
  </style>
</head>
<body>

  <h2>⚡ TokenTable AI 助理</h2>
  <textarea id="prompt" placeholder="請輸入 Prompt 或任務指令..."></textarea>
  <button id="btn" onclick="sendRequest()">送出請求</button>
  <div id="status" class="status"></div>
  <div id="result" class="result-box"></div>

  <script>
    async function sendRequest() {
      const prompt = document.getElementById('prompt').value.trim();
      const status = document.getElementById('status');
      const resultBox = document.getElementById('result');
      const btn = document.getElementById('btn');

      if (!prompt) return alert('請輸入內容！');

      btn.disabled = true;
      status.innerText = '⏳ 正在連線 TokenTable 處理中...';
      resultBox.style.display = 'none';

      try {
        const res = await fetch('/.netlify/functions/api', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        if (data.error) throw new Error(data.error);

        status.innerText = '✅ 處理完成！';
        resultBox.innerText = data.result;
        resultBox.style.display = 'block';

      } catch (err) {
        status.innerText = '❌ 錯誤：' + err.message;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
